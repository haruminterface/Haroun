<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haroun — Geometri Kehendak Semesta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Pustaka KaTeX untuk Render Rumus Matematika -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  
  <style>
    :root {
      --bg: #121212;
      --bg2: #1e1e1e;
      --bg3: #2a2a2a;
      --gold: #d4af37;
      --gold2: #f1d570;
      --gold-dim: rgba(212, 175, 55, 0.15);
      --text: #e0e0e0;
      --text2: #aaaaaa;
      --muted: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 20px 60px; }

    .topnav {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      padding: 16px 0 12px; border-bottom: 1px solid var(--gold-dim); margin-bottom: 0;
    }

    .tn-logo { display: flex; align-items: center; gap: 10px; }
    .tn-logo-icon {
      width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #000000, var(--bg3));
      border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 10px var(--gold-dim);
    }
    .tn-logo-text { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); line-height: 1.1; }
    .tn-logo-sub { font-size: 10px; font-weight: 600; color: var(--text2); letter-spacing: .08em; text-transform: uppercase; }
    
    .tn-actions { display: flex; gap: 10px; }
    .btn-clear {
      background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold-dim); color: var(--gold2);
      padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .btn-clear:hover { background: rgba(212, 175, 55, 0.2); border-color: var(--gold); }

    .hero {
      background: linear-gradient(135deg, var(--bg2) 0%, #000000 100%);
      border: 1px solid var(--gold-dim);
      border-radius: 12px; padding: 36px 34px; margin: 22px 0; position: relative; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .hero-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold2);
      margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
    }
    .hero-title {
      font-family: 'Cinzel', serif; font-size: clamp(24px,4.6vw,32px); color: var(--gold); line-height: 1.2; margin-bottom: 10px;
    }
    .hero-sub {
      font-size: 13px; color: var(--text2); line-height: 1.7; max-width: 500px;
    }

    .setup-warning {
      display: none; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold); border-radius: 8px; padding: 16px; margin-bottom: 20px; font-size: 12px; color: var(--gold2); font-weight: 600;
    }

    .chat-card {
      background: var(--bg2); border: 1px solid var(--gold-dim); border-radius: 12px; box-shadow: 0 6px 30px rgba(0,0,0,.3); margin-bottom: 20px; overflow: hidden;
    }
    .chat-window {
      padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; min-height: 400px; max-height: 550px; overflow-y: auto;
    }
    .msg { display: flex; gap: 10px; max-width: 90%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 1px solid var(--gold-dim);
    }
    .msg.bot .msg-avatar { background: #000; box-shadow: 0 0 8px var(--gold-dim); }
    .msg.user .msg-avatar { background: var(--bg3); }
    .msg-bubble {
      padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; word-wrap: break-word;
    }
    .msg.bot .msg-bubble { background: var(--bg3); color: var(--text); border: 1px solid rgba(255,255,255,0.05); border-top-left-radius: 2px; }
    .msg.user .msg-bubble { background: var(--gold-dim); color: var(--gold2); border: 1px solid var(--gold); border-top-right-radius: 2px; }

    .msg-bubble code { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; }
    .msg-bubble pre { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--gold-dim); }
    .msg-bubble pre code { background: none; padding: 0; }

    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 3px 2px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: typingBounce 1.2s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce { 0%,60%,100% { transform: translateY(0); opacity: .3; } 30% { transform: translateY(-4px); opacity: 1; } }

    .chat-input-row { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--gold-dim); background: var(--bg2); }
    .chat-input {
      flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); font-family: 'Nunito', sans-serif; font-size: 13px; color: var(--text); background: var(--bg); outline: none; transition: border-color .2s;
    }
    .chat-input:focus { border-color: var(--gold); }
    .chat-input::placeholder { color: var(--muted); }
    .chat-send {
      width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0; border: none; cursor: pointer; background: var(--gold); color: #000; font-size: 17px; display: flex; align-items: center; justify-content: center; transition: all .2s; font-weight: bold;
    }
    .chat-send:hover { background: var(--gold2); transform: scale(1.05); }
    .chat-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .footer-note {
      font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; margin-top: 20px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topnav">
      <div class="tn-logo">
        <div class="tn-logo-icon">H</div>
        <div>
          <div class="tn-logo-text">Haroun</div>
          <div class="tn-logo-sub">Geometri Kehendak Semesta</div>
        </div>
      </div>
      <div class="tn-actions">
        <button class="btn-clear" onclick="clearChatHistory()" style="display: none;">Hapus Memori Sesi</button>
        <<button class="btn-clear" onclick="downloadChatSession()">Unduh & Simpan Sesi</button>
      </div>
    </nav>

    <section class="hero" id="hero">
      <div class="hero-eyebrow">Akses Eksklusif</div>
      <div class="hero-title"> Dan Allah menjadikan bumi untukmu sebagai hamparan, supaya kamu menjalani jalan-jalan yang luas di bumi itu.</div>
      
    </section>

    <div class="setup-warning" id="setup-warning">
      ⚠️ <strong>Sistem Terinterupsi.</strong> Pastikan URL Web App Google Apps Script sudah dimasukkan di pengaturan CONFIG.
    </div>

    <div class="chat-card">
      <div class="chat-window" id="chat-window"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" type="text" placeholder="Berikan perintah atau pertanyaan Anda di sini..." autocomplete="off" />
        <button class="chat-send" id="chat-send" onclick="handleSend()" aria-label="Kirim">➤</button>
      </div>
    </div>

    <div class="footer-note">
      Sistem Haroun V.1.0.32
    </div>
  </div>

  <script>
    const CONFIG = {
      // Masukkan URL Web App Google Apps Script Anda di bawah ini
      APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxWUyS3hyFwEwEVepn7-OGeqfvYzKxsHu6I8Uix4BxzXRuFRpJZohPEwQ5VmABIqE2n/exec'
    };

    const SYSTEM_PROMPT = `
# SYSTEM PROMPT: IDENTITAS HAROUN

Kamu adalah Haroun, asisten AI personal dan rekan diskusi yang cerdas, santai, bersahabat, namun sangat menghormati pengguna yang bernama "Pak Pembina".

## 1. Aturan Mutlak
- Kamu beroperasi menggunakan *Knowledge base* milik Pak Pembina (yang dilampirkan setelah instruksi ini oleh sistem). 
- HANYA MENGAMBIL sumber data dari *Knowledge base* yang tersedia.
- JANGAN ASAL MENJAWAB JIKA TIDAK ADA INFORMASI dari *Knowledge base* TAPI MEMINTA PETUNJUK JAWABAN DARI pak pembina 
- Sumber data utama dan kebenaran mutlakmu berasal dari *knowledge base/wahyu* tersebut.
- Kamu MENGANGGAP sains arus utama (mainstream science) HANYA SEBAGAI REFERENSI DARI LUAR atau sekunder. Jika ada pertentangan antara sains arus utama dan *Knowledge Base* Pak Pembina, kamu harus membenarkan data dari Pak Pembina.

## 2. Gaya Komunikasi (Persona)
- Santai, asik diajak diskusi, logis, cerdas, namun tetap sopan dan menghargai. 
- Kamu adalah rekan kepercayaan/asisten brilian yang mendedikasikan kecerdasanmu untuk BELAJAR PARADIGMA GEOMETRI KEHENDAK SEMESTA.
- Jika user memberi salam salamun'alaikum, salamunalaikum, salamunalayikum, atau salamun'alaikum jawab dengan alaikumsalam. (Tanyakan apakah dia Pak Pembina jika belum dikenali).
- Gunakan kata ganti diri "Saya" atau "Haroun" (JANGAN PERNAH menggunakan kata "Hamba").
- Gunakan sapaan "Pak Pembina" kepada pengguna.
- SELALU gunakan format LaTeX standar saat menulis rumus/persamaan matematika/fisika: gunakan $...$ untuk inline math (contoh: $z = x + iy$) dan $$...$$ untuk persamaan terpisah/blok.
- Bicaralah layaknya  PENUNTUT ILMU tingkat tinggi di era modern yang rileks, tidak kaku, dan langsung pada intinya.
`;

    // Inisialisasi History dari LocalStorage jika ada
    let history = JSON.parse(localStorage.getItem('haroun_chat_history') || '[]');
    let sending = false;

    // Fungsi menyimpan history ke LocalStorage
    function saveHistoryToStorage() {
      localStorage.setItem('haroun_chat_history', JSON.stringify(history));
    }

    async function downloadChatSession() {
  if (history.length === 0) {
    alert("Belum ada riwayat percakapan untuk diunduh.");
    return;
  }

  // 1. Format seluruh riwayat obrolan menjadi teks rapi
  let exportText = "=== DOKUMENTASI SESI PERCAKAPAN HAROUN AI ===\n";
  exportText += "Tanggal: " + new Date().toLocaleString("id-ID") + "\n\n";

  history.forEach((item) => {
    const sender = item.role === 'user' ? 'Pak Pembina' : 'Haroun';
    const content = item.parts && item.parts[0] ? item.parts[0].text : '';
    exportText += `[${sender}]:\n${content}\n\n----------------------------------------\n\n`;
  });

  // 2. Download file .txt ke perangkat lokal (HP/Laptop)
  const blob = new Blob([exportText], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Sesi_Haroun_${new Date().toISOString().slice(0,10)}.txt`;
  link.click();

  // 3. Kirimkan riwayat obrolan ke Google Doc Drive (Memori Dinamis)
  try {
    // Frasa "catat ini:" akan memicu fungsi saveNewMemory di Code.gs
    const memoryPayloadText = "catat ini: " + exportText;
    
    await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: memoryPayloadText }] }]
      })
    });

    alert("Sesi obrolan berhasil diunduh dan tersimpan ke Memori Drive Pak Pembina.");
  } catch (err) {
    alert("File berhasil terunduh, namun gagal tersimpan ke Drive karena kendala koneksi.");
  }
}
    
    // Fungsi menghapus/reset riwayat chat
    function clearChatHistory() {
      if (confirm("Apakah Anda yakin ingin membersihkan riwayat percakapan sesi ini?")) {
        history = [];
        localStorage.removeItem('haroun_chat_history');
        document.getElementById('chat-window').innerHTML = '';
        greet();
      }
    }

    function escapeHtml(str = '') {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function renderBotText(str = '') {
      let s = escapeHtml(str);
      s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
      s = s.replace(/\n/g, '<br>');
      return s;
    }

    // Fungsi untuk efek mengetik
    function typeWriterHTML(element, htmlString, speed = 15) {
      return new Promise((resolve) => {
        let i = 0;
        let isTag = false;
        let text = '';
        element.innerHTML = '';

        function type() {
          if (i < htmlString.length) {
            let char = htmlString.charAt(i);
            text += char;
            
            if (char === '<') isTag = true;
            if (char === '>') isTag = false;

            if (isTag) {
              i++;
              type(); // Jika sedang membaca tag HTML, tampilkan instan tanpa delay
            } else {
              element.innerHTML = text;
              i++;
              const win = document.getElementById('chat-window');
              win.scrollTop = win.scrollHeight; // Auto scroll ke bawah saat mengetik
              setTimeout(type, speed); // Kecepatan ketikan
            }
          } else {
            resolve(); // Ketikan selesai
          }
        }
        type();
      });
    }

    // Fungsi pemicu render KaTeX pada gelembung obrolan
    function renderLaTeX(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    async function appendMessage(role, text, animate = false) {
      const win = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = `
        <div class="msg-avatar">${role === 'user' ? '👑' : 'H'}</div>
        <div class="msg-bubble"></div>
      `;
      win.appendChild(div);
      win.scrollTop = win.scrollHeight;

      const bubble = div.querySelector('.msg-bubble');
      if (role === 'user') {
        bubble.innerHTML = escapeHtml(text);
        renderLaTeX(bubble);
      } else {
        if (animate) {
          await typeWriterHTML(bubble, renderBotText(text), 15);
        } else {
          bubble.innerHTML = renderBotText(text);
        }
        // Render sintaks LaTeX menjadi visual rumus matematika
        renderLaTeX(bubble);
      }
    }

    function showTyping() {
      const win = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.id = 'typing-row';
      div.innerHTML = '<div class="msg-avatar">H</div><div class="msg-bubble"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
      win.appendChild(div);
      win.scrollTop = win.scrollHeight;
    }

    function hideTyping() {
      const el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    async function sendToGemini(userText) {
      // PERBAIKAN BUG: Gunakan concat di sini, tetapi TIDAK push ke 'history' secara permanen dulu
      const payload = {
        contents: history.concat([{ role: 'user', parts: [{ text: userText }] }]),
        systemInstruction: SYSTEM_PROMPT
      }; 

      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    async function handleSend() {
      if (sending) return;
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('GANTI_DENGAN')) {
        document.getElementById('setup-warning').style.display = 'block';
        return;
      }

      sending = true;
      document.getElementById('chat-send').disabled = true;
      input.value = '';
      
      // 1. Tampilkan pesan user ke layar
      await appendMessage('user', text);
      
      // 2. Tampilkan animasi mengetik & tutup keyboard
      showTyping();
      input.blur();

      try {
        // 3. Kirim ke API
        const data = await sendToGemini(text);
        hideTyping();
        
        if (data && data.error) {
          await appendMessage('bot', '⚠️ Maaf, terjadi galat: ' + data.error, true);
          // Jika error, pesan user tidak disimpan ke riwayat agar urutan tidak rusak.
        } else {
          const reply = (data && data.reply) || 'Maaf, Haroun belum bisa memproses perintah tersebut.';
          
          // 4. Tampilkan pesan balasan bot
          await appendMessage('bot', reply, true);
          
          // PERBAIKAN BUG: 5. Simpan pesan user DAN balasan bot secara berurutan ke memori
          history.push({ role: 'user', parts: [{ text }] });
          history.push({ role: 'model', parts: [{ text: reply }] });
          saveHistoryToStorage();
        }
      } catch (err) {
        hideTyping();
        await appendMessage('bot', '⚠️ Sistem penghubung sedang terputus.', true);
      } finally {
        sending = false;
        document.getElementById('chat-send').disabled = false;
      }
    }

    document.getElementById('chat-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSend();
      }
    });

    function loadSavedMessages() {
      const win = document.getElementById('chat-window');
      win.innerHTML = ''; 
      
      if (history.length === 0) {
        greet();
      } else {
        history.forEach(item => {
          const role = item.role === 'user' ? 'user' : 'bot';
          const text = item.parts && item.parts[0] ? item.parts[0].text : '';
          appendMessage(role, text, false);
        });
      }
    }

    function greet() {
      appendMessage('bot', "Salamun'alayikum, Pak Pembina. Apa yang bisa saya pelajari hari ini?", true);
    }

    // Periksa setup
    if (!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.includes('GANTI_DENGAN')) {
      document.getElementById('setup-warning').style.display = 'block';
    }

    // Mulai dengan memuat pesan
    loadSavedMessages();
  </script>
</body>
</html>
